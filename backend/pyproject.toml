[project]
name = "brewql-backend"
version = "0.1.0"
description = "BrewQL backend: Text-to-SQL API for Find Coffee operations data"
requires-python = ">=3.13"
dependencies = [
    "anthropic[bedrock]>=2.4.0",
    "asyncpg>=0.32.0",
    "boto3>=1.43.123",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "sqlglot>=30.29.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.isort]
# Without this, ruff sorts a first-party module as third-party until its file exists (red tests).
known-first-party = ["app", "evaluation", "scripts"]
