# BrewQL golden set: fixed questions to measure the full pipeline (guardrail, model, SQL guard, retry).
#
# Writing rules (see openspec eval-golden-set design D9, D12):
# - Answerable questions name the columns to return; results are compared by value, so an extra column is wrong.
# - Avoid "top N" over values with ties (rating, user_ratings_total): several answers would be right.
# - Questions are precise enough that a clarifying question would be a mistake.
# - When tickets add data, add questions here; never copy these into RAG examples (ticket 9).

# --- easy: one table, one filter or aggregate --------------------------------------------------
- id: q01
  difficulty: easy
  question: 台北市有幾家咖啡店？
  sql: SELECT COUNT(*) FROM cafes WHERE city = '台北市'

- id: q02
  difficulty: easy
  question: 新北市有哪些行政區有咖啡店？只列出行政區名稱
  sql: SELECT DISTINCT district FROM cafes WHERE city = '新北市'

- id: q03
  difficulty: easy
  question: 可以帶寵物的咖啡店有幾家？
  sql: SELECT COUNT(*) FROM cafes WHERE pet_friendly

- id: q04
  difficulty: easy
  question: 大安區咖啡店的平均評分是多少？取到小數點後兩位
  sql: SELECT ROUND(AVG(rating)::numeric, 2) FROM cafes WHERE district = '大安區'

- id: q05
  difficulty: easy
  question: 有店貓或店狗的咖啡店有幾家？
  sql: SELECT COUNT(*) FROM cafes WHERE has_pet

# --- medium: grouping, business definitions, dates ---------------------------------------------
- id: q06
  difficulty: medium
  question: 台北市各行政區各有幾家咖啡店？列出行政區與店數
  sql: SELECT district, COUNT(*) FROM cafes WHERE city = '台北市' GROUP BY district

- id: q07
  difficulty: medium
  question: 工作友善的咖啡店有幾家？
  # "工作友善" is defined in the schema context: not time-limited (or maybe) and sockets yes/maybe.
  sql: >-
    SELECT COUNT(*) FROM cafes
    WHERE limited_time IN ('no', 'maybe') AND has_socket IN ('yes', 'maybe')

- id: q08
  difficulty: medium
  question: 平均評分最高的行政區是哪一個？只列出行政區名稱
  # 板橋區 leads at 4.38 with no tie.
  sql: >-
    SELECT district FROM cafes GROUP BY district
    ORDER BY AVG(rating) DESC LIMIT 1

- id: q09
  difficulty: medium
  question: 2025 年每個月新上架幾家咖啡店？列出月份（YYYY-MM 格式）與店數，依月份排序
  ordered: true
  sql: >-
    SELECT to_char(created_at, 'YYYY-MM') AS month, COUNT(*) FROM cafes
    WHERE created_at >= '2025-01-01' AND created_at < '2026-01-01'
    GROUP BY month ORDER BY month

# --- hard: ratios, subqueries ------------------------------------------------------------------
- id: q10
  difficulty: hard
  question: 各行政區工作友善咖啡店佔該區店數的百分比是多少？取到小數點後一位，列出行政區與百分比
  sql: >-
    SELECT district,
           ROUND(100.0 * COUNT(*) FILTER (
             WHERE limited_time IN ('no', 'maybe') AND has_socket IN ('yes', 'maybe')
           ) / COUNT(*), 1)
    FROM cafes GROUP BY district

- id: q11
  difficulty: hard
  question: 評論數高於所有咖啡店平均評論數的店，各城市各有幾家？列出城市與店數
  sql: >-
    SELECT city, COUNT(*) FROM cafes
    WHERE user_ratings_total > (SELECT AVG(user_ratings_total) FROM cafes)
    GROUP BY city

# --- trends: search_logs (ticket 6). Whole-table questions, so "最近半年" boundaries never matter.
- id: q16
  difficulty: medium
  question: 每個月有幾次搜尋？列出月份（YYYY-MM 格式）與搜尋次數，依月份排序
  ordered: true
  sql: >-
    SELECT to_char(created_at, 'YYYY-MM') AS month, COUNT(*) FROM search_logs
    GROUP BY month ORDER BY month

- id: q17
  difficulty: medium
  question: 每個月勾選不限時的搜尋有幾次？列出月份（YYYY-MM 格式）與次數，依月份排序
  ordered: true
  sql: >-
    SELECT to_char(created_at, 'YYYY-MM') AS month, COUNT(*) FROM search_logs
    WHERE filters @> '{"no_time_limit": true}'
    GROUP BY month ORDER BY month

- id: q18
  difficulty: hard
  question: >-
    每個月工作友善的搜尋（同時勾選不限時與插座）佔當月搜尋的百分比是多少？
    取到小數點後一位，列出月份（YYYY-MM 格式）與百分比，依月份排序
  ordered: true
  sql: >-
    SELECT to_char(created_at, 'YYYY-MM') AS month,
           ROUND(100.0 * COUNT(*) FILTER (
             WHERE filters @> '{"no_time_limit": true, "has_socket": true}'
           ) / COUNT(*), 1)
    FROM search_logs GROUP BY month ORDER BY month

# --- district comparison (ticket 7): search_logs grouped by district -----------------------------
- id: q19
  difficulty: medium
  question: 各行政區的搜尋次數是多少？列出行政區與次數，由多到少排序
  ordered: true
  sql: >-
    SELECT district, COUNT(*) AS n FROM search_logs
    GROUP BY district ORDER BY n DESC

- id: q20
  difficulty: medium
  question: >-
    各行政區的搜尋落空率是多少？以 0 到 1 的比例表示、取到小數點後 3 位，
    列出行政區與落空率，由高到低排序
  ordered: true
  sql: >-
    SELECT district,
           ROUND(COUNT(*) FILTER (WHERE result_count = 0)::numeric / COUNT(*), 3) AS rate
    FROM search_logs GROUP BY district ORDER BY rate DESC

- id: q21
  difficulty: hard
  question: 搜尋次數前 5 名的行政區中，搜尋落空率最高的是哪一區？只列出行政區名稱
  sql: >-
    WITH top5 AS (
      SELECT district,
             COUNT(*) FILTER (WHERE result_count = 0)::numeric / COUNT(*) AS rate
      FROM search_logs GROUP BY district ORDER BY COUNT(*) DESC LIMIT 5
    )
    SELECT district FROM top5 ORDER BY rate DESC LIMIT 1

# --- views, favorites and community ratings (ticket 8) ------------------------------------------
- id: q22
  difficulty: hard
  question: >-
    從搜尋結果進入和從 LINE 選單進入，收藏轉換率各是多少？以 0 到 1 的比例表示、
    取到小數點後 3 位，列出入口與轉換率
  sql: >-
    SELECT v.source,
           ROUND((SELECT COUNT(*) FROM favorites f WHERE f.source = v.source)::numeric / COUNT(*), 3) AS rate
    FROM cafe_views v WHERE v.source IN ('search', 'rich_menu') GROUP BY v.source

- id: q23
  difficulty: medium
  question: Google 評分 4.7 以上、但收藏數低於所有店中位數的咖啡店有哪些？列出店名
  sql: >-
    SELECT name FROM cafes
    WHERE rating >= 4.7
      AND favorite_count < (SELECT percentile_cont(0.5) WITHIN GROUP (ORDER BY favorite_count) FROM cafes)

- id: q24
  difficulty: medium
  question: 工作友善、而且 Cafe Nomad 網路評分 4 分以上的咖啡店有幾家？
  sql: >-
    SELECT COUNT(*) FROM v_cafe_profile
    WHERE limited_time IN ('no', 'maybe') AND has_socket IN ('yes', 'maybe') AND wifi >= 4

- id: q25
  difficulty: medium
  question: 最近 30 天有幾位活躍使用者？
  sql: >-
    SELECT COUNT(DISTINCT user_id) FROM (
      SELECT user_id FROM search_logs WHERE created_at >= now() - interval '30 days'
      UNION
      SELECT user_id FROM cafe_views WHERE created_at >= now() - interval '30 days'
    ) active

- id: q26
  difficulty: easy
  question: 各個入口（搜尋結果、收藏清單、LINE 選單）的瀏覽次數各是多少？列出入口與次數
  sql: SELECT source, COUNT(*) FROM cafe_views GROUP BY source

# --- government open data joined by district (import-open-data) ------------------------------
- id: q27
  difficulty: medium
  question: 每萬人咖啡店數最高的 3 個行政區是哪些？列出行政區與每萬人咖啡店數，取到小數點後兩位
  sql: >-
    SELECT c.district, ROUND(COUNT(*)::numeric / p.population * 10000, 2) AS per_10k
    FROM cafes c JOIN district_population p USING (city, district)
    GROUP BY c.district, p.population ORDER BY per_10k DESC LIMIT 3

- id: q28
  difficulty: medium
  question: 有大專校院的行政區中，哪一區的咖啡店最多？列出行政區與店數
  sql: >-
    SELECT c.district, COUNT(*) AS cafes FROM cafes c
    WHERE EXISTS (SELECT 1 FROM universities u WHERE u.city = c.city AND u.district = c.district)
    GROUP BY c.district ORDER BY cafes DESC LIMIT 1

- id: q29
  difficulty: hard
  question: 搜尋次數前 5 名的行政區中，每萬人搜尋次數最高的是哪一區？只列出行政區名稱
  sql: >-
    WITH top5 AS (
      SELECT city, district, COUNT(*) AS searches
      FROM search_logs GROUP BY city, district ORDER BY searches DESC LIMIT 5
    )
    SELECT t.district FROM top5 t JOIN district_population p USING (city, district)
    ORDER BY t.searches::numeric / p.population DESC LIMIT 1

