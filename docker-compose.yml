services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: genbi
      POSTGRES_USER: ${POSTGRES_USER:-genbi_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      GENBI_READER_PASSWORD: ${GENBI_READER_PASSWORD:?set GENBI_READER_PASSWORD in .env}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      # Bound to localhost only; never exposed on a public interface.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d genbi"]
      interval: 5s
      retries: 20

volumes:
  pgdata:
