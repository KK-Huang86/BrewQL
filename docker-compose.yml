services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: genbi
      POSTGRES_USER: ${POSTGRES_USER:-genbi_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      GENBI_READER_PASSWORD: ${GENBI_READER_PASSWORD:?set GENBI_READER_PASSWORD in .env}
      GENBI_AUDIT_WRITER_PASSWORD: ${GENBI_AUDIT_WRITER_PASSWORD:?set GENBI_AUDIT_WRITER_PASSWORD in .env}
      GENBI_KNOWLEDGE_WRITER_PASSWORD: ${GENBI_KNOWLEDGE_WRITER_PASSWORD:?set GENBI_KNOWLEDGE_WRITER_PASSWORD in .env}
      # demo (default) seeds simulated data; real leaves it to cafe-import (import-real-cafes D1).
      DATASET: ${DATASET:-demo}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      # Bound to localhost only; never exposed on a public interface.
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    labels:
      brewql.metrics: "true"
    healthcheck:
      # Over TCP: during init Postgres listens only on its socket, so this stays false until init is done.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d genbi"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      # Read-only role only; the owner credentials never reach the API.
      DATABASE_URL: postgresql://genbi_reader:${GENBI_READER_PASSWORD}@db:5432/genbi
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # Empty would make botocore look for a profile named "", so fall back to "default".
      AWS_PROFILE: ${AWS_PROFILE:-default}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-anthropic.claude-haiku-5-5}
      # No colon: an explicitly empty value stays empty and disables effort.
      BEDROCK_EFFORT: ${BEDROCK_EFFORT-low}
      # Empty skips the input guardrail (startup warning); set both after terraform apply.
      BEDROCK_GUARDRAIL_ID: ${BEDROCK_GUARDRAIL_ID:-}
      BEDROCK_GUARDRAIL_VERSION: ${BEDROCK_GUARDRAIL_VERSION:-}
      MAX_SQL_RETRIES: ${MAX_SQL_RETRIES:-1}
      DAILY_QUESTION_LIMIT: ${DAILY_QUESTION_LIMIT:-500}
      # rag (default) or static (rag-knowledge-base D10); knowledge-import below runs before the backend.
      PROMPT_MODE: ${PROMPT_MODE:-rag}
      EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:-amazon.titan-embed-text-v2:0}
      # Append-only audit role (record-audit-log D2); the backend refuses to start without these.
      AUDIT_DATABASE_URL: postgresql://genbi_audit_writer:${GENBI_AUDIT_WRITER_PASSWORD}@db:5432/genbi
      AUDIT_IP_HMAC_KEY: ${AUDIT_IP_HMAC_KEY:?set AUDIT_IP_HMAC_KEY in .env (32+ characters)}
    volumes:
      # Local dev: reuse host AWS credentials read-only. On EC2 the instance role is used instead.
      - ${HOME}/.aws:/home/app/.aws:ro
    ports:
      - "127.0.0.1:8000:8000"
    labels:
      # Alloy ships logs only from containers with brewql.logs and resource metrics only from
      # containers with brewql.metrics (observe-with-grafana D8, D8b).
      brewql.logs: "true"
      brewql.metrics: "true"
    depends_on:
      db:
        condition: service_healthy
      knowledge-import:
        condition: service_completed_successfully
      cafe-import:
        condition: service_completed_successfully

  # One-shot real cafe import (import-real-cafes D3): DATASET=demo skips it; DATASET=real imports the
  # exports in REAL_DATA_DIR (outside the repo, read-only) into an empty real database, in one
  # transaction with simulated members and behaviour. A real database that has cafes is left alone;
  # to import a newer export: DATASET=real docker compose down -v, then up again.
  cafe-import:
    build: ./backend
    command: ["python", "-m", "scripts.import_real_cafes"]
    environment:
      DATASET: ${DATASET:-demo}
      # The owner writes cafes; only this one-shot container gets it, never the backend.
      REAL_IMPORT_DATABASE_URL: postgresql://${POSTGRES_USER:-genbi_owner}:${POSTGRES_PASSWORD}@db:5432/genbi
      REAL_DATA_DIR: /real-data
    volumes:
      - ${REAL_DATA_DIR:-./db/import}:/real-data:ro
    depends_on:
      db:
        condition: service_healthy

  # One-shot RAG knowledge import (rag-knowledge-base): runs on every `up` before the backend, so a
  # rebuilt database never serves rag with an empty knowledge base. Unchanged documents cost nothing;
  # a failed import keeps the backend down (PROMPT_MODE=static skips it). The documents are baked into
  # the image, so after editing them:
  # docker compose run --rm --build knowledge-import
  knowledge-import:
    build: ./backend
    command: ["python", "-m", "scripts.import_knowledge"]
    environment:
      # static skips the import, so falling back to static never waits on Titan (D6).
      PROMPT_MODE: ${PROMPT_MODE:-rag}
      KNOWLEDGE_DATABASE_URL: postgresql://genbi_knowledge_writer:${GENBI_KNOWLEDGE_WRITER_PASSWORD}@db:5432/genbi
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_PROFILE: ${AWS_PROFILE:-default}
      EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:-amazon.titan-embed-text-v2:0}
    volumes:
      - ${HOME}/.aws:/home/app/.aws:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      # Per-IP limits on /api/ask (limit-public-traffic D8); a bad value stops nginx.
      ASK_RATE_PER_MINUTE: ${ASK_RATE_PER_MINUTE:-10}
      ASK_RATE_BURST: ${ASK_RATE_BURST:-5}
      MAX_CONNECTIONS_PER_IP: ${MAX_CONNECTIONS_PER_IP:-20}
    ports:
      - "127.0.0.1:8080:80"
    labels:
      brewql.logs: "true"
      brewql.metrics: "true"
    depends_on:
      backend:
        condition: service_healthy

  # Off unless started with --profile observability; the app never depends on it (D2).
  alloy:
    image: grafana/alloy:v1.14.0
    profiles: ["observability"]
    # Exporters label host and container series with this name as `instance`; the default
    # (the container ID) would start new series every time Alloy is recreated.
    hostname: brewql-alloy
    labels:
      brewql.metrics: "true"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      # Empty defaults keep `docker compose up` without the profile free of warnings.
      GRAFANA_CLOUD_PROMETHEUS_URL: ${GRAFANA_CLOUD_PROMETHEUS_URL:-}
      GRAFANA_CLOUD_PROMETHEUS_USER: ${GRAFANA_CLOUD_PROMETHEUS_USER:-}
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL:-}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER:-}
      GRAFANA_CLOUD_TOKEN: ${GRAFANA_CLOUD_TOKEN:-}
      # Tells local runs from the deployed demo in the shared stack (D8a).
      BREWQL_ENV: ${BREWQL_ENV:-local}
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only, yet it can still read every container's settings: only Alloy gets it (D8).
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Host and container resources (D8b), all read-only.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      # With Docker's containerd image store (overlayfs driver), cAdvisor asks containerd for layers.
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    ports:
      # Alloy's debug UI, localhost only.
      - "127.0.0.1:12345:12345"
    depends_on:
      - backend

volumes:
  # One volume per dataset, so switching never mixes real cafes into demo (import-real-cafes D1).
  pgdata:
    name: genbi_pgdata_${DATASET:-demo}
