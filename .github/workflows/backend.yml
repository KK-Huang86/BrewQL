name: backend

on:
  # Every PR runs both workflows: required checks must always report,
  # and a skipped path-filtered run would block the merge forever.
  pull_request:
  push:
    branches: [develop, main]
    paths: ["backend/**", "db/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: genbi
          POSTGRES_USER: genbi_owner
          POSTGRES_PASSWORD: ci-owner-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U genbi_owner -d genbi"
          --health-interval 5s --health-retries 20
    env:
      # Same init scripts as docker compose; CI-only throwaway passwords.
      PGHOST: localhost
      PGPASSWORD: ci-owner-password
      POSTGRES_USER: genbi_owner
      POSTGRES_DB: genbi
      GENBI_READER_PASSWORD: ci-reader-password
      GENBI_AUDIT_WRITER_PASSWORD: ci-audit-password
      GENBI_KNOWLEDGE_WRITER_PASSWORD: ci-knowledge-password
      TEST_DATABASE_URL: postgresql://genbi_reader:ci-reader-password@localhost:5432/genbi
      TEST_AUDIT_DATABASE_URL: postgresql://genbi_audit_writer:ci-audit-password@localhost:5432/genbi
      TEST_KNOWLEDGE_DATABASE_URL: postgresql://genbi_knowledge_writer:ci-knowledge-password@localhost:5432/genbi
      TEST_OWNER_DATABASE_URL: postgresql://genbi_owner:ci-owner-password@localhost:5432/genbi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Seed demo database
        run: |
          psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f db/init/01_schema.sql
          bash db/init/02_seed.sh
          bash db/init/03_readonly_role.sh
          bash db/init/04_audit.sh
          bash db/init/05_knowledge.sh
      - name: Check the demo data story
        run: PSQL="psql -U $POSTGRES_USER -d $POSTGRES_DB" bash db/checks/run.sh
      - name: Install
        working-directory: backend
        run: uv sync --frozen --group dev
      - name: Lint
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test (unit + integration)
        working-directory: backend
        run: uv run pytest -q -rs
