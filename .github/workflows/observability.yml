name: observability

on:
  # Every PR runs it so a required check always reports; pushes only when the config changes.
  pull_request:
  push:
    branches: [develop, main]
    paths: ["observability/**", ".github/workflows/observability.yml"]

permissions:
  contents: read

jobs:
  alloy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same image version as docker-compose.yml; dummy URLs only satisfy sys.env during validation.
      - name: alloy fmt and validate
        run: |
          docker run --rm -v "$PWD/observability/alloy:/cfg:ro" grafana/alloy:v1.14.0 fmt -t /cfg/config.alloy
          docker run --rm -e GRAFANA_CLOUD_PROMETHEUS_URL=http://example.invalid \
            -e GRAFANA_CLOUD_LOKI_URL=http://example.invalid \
            -v "$PWD/observability/alloy:/cfg:ro" grafana/alloy:v1.14.0 validate /cfg/config.alloy
